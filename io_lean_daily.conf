# Lean daily output for ng5 long runs (ng5-long-run branch).
# Use with:  FESOM_IO_CONFIG=io_lean_daily.conf  FESOM_IO_EXCLUSIVE=1
# Grammar: <var[,var...]>  <period[:kind]>   (period: step|hourly|daily|monthly|yearly)
# With FESOM_IO_EXCLUSIVE set, ONLY these vars are written (no monthly defaults).
# All are daily means. sst/sss/a_ice/m_ice are 2D node; u_*/v_* are 2D element
# (surface = layer 0, 100m = model layer nearest 100 m).
sst,sss,u_surf,v_surf,u_100m,v_100m,a_ice,m_ice daily
